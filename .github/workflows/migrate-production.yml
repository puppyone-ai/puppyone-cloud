name: Deploy Database to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_ref:
    name: Validate protected production source
    if: github.repository == 'puppyone-ai/puppyone-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production database releases must run from the main branch."
            exit 1
          fi

  resolve_data_release:
    name: Resolve production data release
    needs: validate_ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migration_id: ${{ steps.release.outputs.migration_id }}
      repair_migration_id: ${{ steps.release.outputs.repair_migration_id }}
      execution_mode: ${{ steps.release.outputs.execution_mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate production migration pointer
        id: release
        shell: bash
        run: |
          set -euo pipefail
          request="supabase/releases/production-data-migration.json"
          migration_id=$(jq -er '.migration_id | select(type == "string")' "$request")
          case "$migration_id" in
            ''|*[!0-9A-Za-z_]*)
              echo "::error::Invalid production data migration ID."
              exit 1
              ;;
          esac
          if [ ! -d "supabase/data_migrations/$migration_id" ]; then
            echo "::error::Production data migration artifact does not exist."
            exit 1
          fi
          execution_mode=$(jq -er '.execution_mode // "ci" | select(type == "string")' "$request")
          case "$execution_mode" in
            ci|operator_local) ;;
            *)
              echo "::error::Invalid production data migration execution mode."
              exit 1
              ;;
          esac
          repair_migration_id=$(jq -er '.repair_migration_id // "" | select(type == "string")' "$request")
          if [ "$execution_mode" = "operator_local" ] && [ -n "$repair_migration_id" ]; then
            echo "::error::Operator-local data migrations cannot declare a CI repair artifact."
            exit 1
          fi
          if [ -n "$repair_migration_id" ]; then
            case "$repair_migration_id" in
              *[!0-9A-Za-z_]*)
                echo "::error::Invalid production repair data migration ID."
                exit 1
                ;;
            esac
            if [ ! -d "supabase/data_migrations/$repair_migration_id" ]; then
              echo "::error::Production repair data migration artifact does not exist."
              exit 1
            fi
          fi
          echo "migration_id=$migration_id" >> "$GITHUB_OUTPUT"
          echo "repair_migration_id=$repair_migration_id" >> "$GITHUB_OUTPUT"
          echo "execution_mode=$execution_mode" >> "$GITHUB_OUTPUT"

  historical_upgrade:
    name: Complete reviewed historical upgrade
    needs: resolve_data_release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: database-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ACCESS_CREDENTIAL_HASH_SECRET: ${{ secrets.ACCESS_CREDENTIAL_HASH_SECRET }}
      LEGACY_UPGRADE_AUTHORIZATION: ${{ secrets.LEGACY_UPGRADE_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: "2.107.0"
      - name: Install locked runtime and PostgreSQL client
        working-directory: backend
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run immutable historical sequence and continuity checks
        working-directory: backend
        run: uv run python -m src.infra.data_migrations.historical_release

  prepare_schema:
    name: Apply compatible schema before production data migration
    needs: historical_upgrade
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: production
      allow_data_migration_pause: true

  validate_schema_pause:
    name: Match schema guard to production data migration
    needs:
      - prepare_schema
      - resolve_data_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MIGRATION_ID: ${{ needs.resolve_data_release.outputs.migration_id }}
      REQUIRED_MIGRATION_ID: ${{ needs.prepare_schema.outputs.required_data_migration_id }}
    steps:
      - name: Reject a mismatched contract guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REQUIRED_MIGRATION_ID" ] && [ "$REQUIRED_MIGRATION_ID" != "$EXPECTED_MIGRATION_ID" ]; then
            echo "::error::Schema requires $REQUIRED_MIGRATION_ID, but the production release points to $EXPECTED_MIGRATION_ID."
            exit 1
          fi

  staging_repair_evidence:
    name: Verify staged repair before Production write
    if: >-
      needs.resolve_data_release.outputs.execution_mode == 'ci' &&
      needs.resolve_data_release.outputs.repair_migration_id != ''
    needs: resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.repair_migration_id }}
      operation: verify

  repair_run:
    name: Run production repair after Qubits evidence
    if: >-
      needs.validate_schema_pause.result == 'success' &&
      needs.resolve_data_release.outputs.execution_mode == 'ci' &&
      needs.staging_repair_evidence.result == 'success'
    needs:
      - validate_schema_pause
      - staging_repair_evidence
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: production
      migration_id: ${{ needs.resolve_data_release.outputs.repair_migration_id }}
      operation: run

  staging_data_evidence:
    name: Verify staged data migration before Production write
    if: needs.resolve_data_release.outputs.execution_mode == 'ci'
    needs: resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: verify

  data_plan:
    if: >-
      always() && needs.validate_schema_pause.result == 'success' &&
      needs.staging_data_evidence.result == 'success' &&
      needs.resolve_data_release.outputs.execution_mode == 'ci' &&
      (needs.repair_run.result == 'success' || needs.repair_run.result == 'skipped')
    needs:
      - validate_schema_pause
      - repair_run
      - staging_data_evidence
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: production
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: plan

  data_run:
    # Keep the protected production chain live when no optional repair is
    # staged.  See the matching Qubits workflow for the skipped-job case.
    if: >-
      always() && needs.data_plan.result == 'success' &&
      needs.resolve_data_release.result == 'success' &&
      needs.resolve_data_release.outputs.execution_mode == 'ci'
    needs:
      - data_plan
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: production
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: run

  data_verify:
    if: >-
      always() && needs.data_run.result == 'success' &&
      needs.resolve_data_release.result == 'success' &&
      needs.resolve_data_release.outputs.execution_mode == 'ci'
    needs:
      - data_run
      - resolve_data_release
    uses: ./.github/workflows/_data-migration.yml
    secrets: inherit
    with:
      environment: production
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}
      operation: verify

  staging_operator_evidence:
    name: Verify Qubits operator-local data completion before Production
    if: needs.resolve_data_release.outputs.execution_mode == 'operator_local'
    needs: resolve_data_release
    uses: ./.github/workflows/_operator-data-verify.yml
    secrets: inherit
    with:
      environment: staging
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}

  operator_data_verify:
    name: Verify Production operator-local data completion
    if: >-
      needs.validate_schema_pause.result == 'success' &&
      needs.staging_operator_evidence.result == 'success' &&
      needs.resolve_data_release.outputs.execution_mode == 'operator_local'
    needs:
      - validate_schema_pause
      - staging_operator_evidence
      - resolve_data_release
    uses: ./.github/workflows/_operator-data-verify.yml
    secrets: inherit
    with:
      environment: production
      migration_id: ${{ needs.resolve_data_release.outputs.migration_id }}

  deploy_after_data:
    name: Recheck Production schema after data migration
    if: >-
      always() && (
        (needs.data_verify.result == 'success' && needs.resolve_data_release.outputs.execution_mode == 'ci') ||
        (needs.operator_data_verify.result == 'success' && needs.resolve_data_release.outputs.execution_mode == 'operator_local')
      )
    needs:
      - data_verify
      - operator_data_verify
      - resolve_data_release
    uses: ./.github/workflows/_schema-deploy.yml
    secrets: inherit
    with:
      environment: production
