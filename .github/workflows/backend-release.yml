name: Backend Release Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      auth-redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked
      - name: Prepare owned PostgreSQL and object services
        working-directory: .
        timeout-minutes: 10
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y postgresql-17 postgresql-17-pgtap
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          docker build --target build -t puppyone-entrypoint-minio-build:local -f docker/Dockerfile.minio .
          docker pull postgrest/postgrest:v14.13
      - name: Run backend tests without live third-party services
        run: uv run pytest -q -m 'not e2e and not integration and not network'
