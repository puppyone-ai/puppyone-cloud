name: Hosts and architecture tests

# Test kinds follow backend/tests/README.md: unit and contract tests on every
# pull request; the hosts native tests (real PostgreSQL 17 + PostgREST) here too,
# because qubits pull requests do not run the full backend suite.
on:
  pull_request:
    branches: [qubits, main]
  push:
    branches: [qubits, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-and-architecture-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Unit, contract and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==0.5.11"
          uv sync --locked
      - name: Layout, import layers, public contract and hosts unit + contract tests
        run: uv run pytest -q tests/architecture tests/platform/hosts -m "not native"

  hosts-native:
    name: Hosts on real PostgreSQL 17 + PostgREST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL 17 and locked dependencies
        timeout-minutes: 10
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          python -m pip install 'uv==0.5.11'
          cd backend && uv sync --locked
      - name: Hosts native tests (PostgREST runs in Docker)
        working-directory: backend
        run: uv run pytest -q tests/platform/hosts -m native
