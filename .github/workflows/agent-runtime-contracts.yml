name: Cloud Agent data and runtime contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/tests/agent/**'
      - 'backend/tests/repository_hosting/integration/test_read_request_budgets.py'
      - 'backend/tests/repository_hosting/unit/test_workbench_ref_publication.py'
      - 'backend/tests/repository_hosting/unit/test_publication_context_budget.py'
      - 'backend/agent-worker/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'supabase/migrations/**'
      - 'scripts/testing/native_postgres.py'
      - 'docker/Dockerfile.minio'
      - '.github/workflows/agent-runtime-contracts.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-database-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      # The sandbox worker's project-deletion pass enqueues OCR/ETL cleanup
      # through Redis, as every hosted environment does. Without it the
      # worker-module tests wait on the connection and time out.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 17 and locked dependencies
        timeout-minutes: 10
        run: |
          # Ubuntu 24.04 ships PostgreSQL 16; use the official PGDG repository for 17.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --retry 3 --connect-timeout 10 --max-time 60 --retry-max-time 240 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::https::Timeout=30 -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          python -m pip install 'uv==0.5.11'
          cd backend
          uv sync --locked
      - name: Build offline Pi tools and owned object storage
        run: |
          docker build -t puppyone-cloud-agent:workspace-v3 backend/agent-worker
          # Hosted SSH live cases run the same worker artifact under their own name.
          docker tag puppyone-cloud-agent:workspace-v3 puppyone-workspace-ssh-acceptance:local
          docker build --target build -t puppyone-entrypoint-minio-build:local -f docker/Dockerfile.minio .
          docker pull postgrest/postgrest:v14.13
      - name: Verify actual HTTP budgets, authority, replies and Git recovery
        working-directory: backend
        env:
          APP_ENV: test
          SANDBOX_TYPE: docker
          NO_PROXY: 127.0.0.1,localhost
        run: |
          mkdir -p .agent-test-results
          uv run pytest tests/agent/runtime tests/repository_hosting/integration/test_read_request_budgets.py \
            tests/repository_hosting/unit/test_workbench_ref_publication.py \
            tests/repository_hosting/unit/test_publication_context_budget.py \
            --ignore=tests/agent/runtime/test_desktop_integration.py \
            --hosting-live --hosting-s3 \
            -q --junitxml=.agent-test-results/junit.xml --basetemp=.agent-test-results/cases
          node --test agent-worker/fly-egress.test.mjs agent-worker/git.test.mjs agent-worker/tool-execution.test.mjs agent-worker/tools.test.mjs \
            agent-worker/controller.test.mjs agent-worker/providers/*.test.mjs \
            agent-worker/workbench-publication.test.mjs agent-worker/workbench-relay.test.mjs agent-worker/workspace-merge.test.mjs
          docker build --network=none --no-cache --progress=plain \
            --build-arg WORKBENCH_AGENT_IMAGE=puppyone-cloud-agent:workspace-v3 \
            -f agent-worker/WorkbenchAcceptance.Dockerfile agent-worker
          docker build --network=none --no-cache --progress=plain \
            --build-arg WORKBENCH_AGENT_IMAGE=puppyone-cloud-agent:workspace-v3 \
            -f agent-worker/WorkbenchFileAcceptance.Dockerfile agent-worker
          # Execute the actual harness with its pinned Node and Pi artifact.
          docker run --rm --network=none --entrypoint node \
            --mount "type=bind,src=$PWD/agent-worker/worker.integration.test.mjs,dst=/opt/puppyone-agent/worker.integration.test.mjs,readonly" \
            puppyone-cloud-agent:workspace-v3 --test /opt/puppyone-agent/worker.integration.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: agent-runtime-budget-and-recovery
          path: backend/.agent-test-results/
          include-hidden-files: true
          retention-days: 14
