name: Deploy Database to Qubits

on:
  push:
    branches:
      - qubits
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  # The shared release publishes application images when the environment
  # enables RELEASE_IMAGES; otherwise the images job is a no-op.
  packages: write

concurrency:
  group: database-release-staging
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.repository == 'puppyone-ai/puppyone-cloud' && github.ref == 'refs/heads/qubits'
    uses: ./.github/workflows/_environment-release.yml
    secrets: inherit
    with:
      environment: staging
