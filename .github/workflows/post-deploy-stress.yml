name: Hosted Git consistency stress

# Exercise native write → move → read → Git health on one owned project.
# Use the staging release account for a fresh normal login, not a stored JWT.
# Every requested iteration must finish and project deletion must be requested.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Stress iterations (default 30)'
        required: false
        default: '30'
      api_url:
        description: 'Must match the protected staging acceptance URL'
        required: false
        default: ''
  schedule:
    # 04:00 UTC daily — low-traffic window
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  stress:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qubits'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install "uv==0.5.11"

      - name: Install backend deps (scripts only)
        working-directory: backend
        run: uv sync --locked

      - name: Prepare a private acceptance account file
        working-directory: backend
        env:
          RELEASE_CONFIG_JSON: ${{ secrets.PUPPYONE_RELEASE_CONFIG }}
        run: >-
          uv run python ../scripts/testing/hosted_git_stress.py
          --prepare-account "$RUNNER_TEMP/hosted-git-smoke-account.json"

      - name: Run stress
        working-directory: backend
        env:
          STRESS_ITERATIONS: ${{ inputs.iterations || '30' }}
          PUPPYONE_API_URL: ${{ inputs.api_url || '' }}
        run: |
          set -euo pipefail
          python -c 'import os, re; value = os.environ["STRESS_ITERATIONS"]; assert re.fullmatch(r"[0-9]{1,3}", value) and 1 <= int(value) <= 100, "iterations must be 1..100"'
          uv run python ../scripts/testing/hosted_git_stress.py \
            --account-file "$RUNNER_TEMP/hosted-git-smoke-account.json" \
            --iterations "$STRESS_ITERATIONS"

      - name: Remove the private acceptance account file
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'hosted-git-smoke-account.json').unlink(missing_ok=True)
          PY
