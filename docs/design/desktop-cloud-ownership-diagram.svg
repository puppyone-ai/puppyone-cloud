<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f3ecdf; }
      .panel { fill: #fffaf1; stroke: #d8cfbf; stroke-width: 2; }
      .subpanel { fill: #fbf5ea; stroke: #ded5c6; stroke-width: 2; }
      .muted { fill: #82786c; font: 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #82786c; font: 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #91887c; font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #2d2a26; font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h2 { fill: #2d2a26; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h3 { fill: #2d2a26; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #2d2a26; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #277a38; font: 700 20px "SFMono-Regular", Consolas, monospace; }
      .green { fill: #1f8a3a; }
      .greenStroke { stroke: #2d9b4a; }
      .pill { fill: #e7f5e9; stroke: #9ccda6; stroke-width: 2; }
      .pillText { fill: #1f8a3a; font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { stroke: #bdb2a2; stroke-width: 3; fill: none; }
      .lineStrong { stroke: #2d9b4a; stroke-width: 4; fill: none; }
      .arrow { fill: #2d9b4a; }
      .dash { stroke: #bdb2a2; stroke-width: 3; stroke-dasharray: 9 9; fill: none; }
      .iconStroke { fill: none; stroke: #82786c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .folder { fill: #4c9af7; }
      .file { fill: #fffaf1; stroke: #cfc5b5; stroke-width: 2; }
    </style>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path class="arrow" d="M0,0 L12,6 L0,12 Z" />
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path fill="#bdb2a2" d="M0,0 L12,6 L0,12 Z" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000" />

  <text x="80" y="82" class="title">Desktop 要传达的心智模型</text>
  <text x="80" y="124" class="muted">用户看到的是本地 editor，但数据归属和协作源头在 Cloud project。</text>

  <rect x="80" y="170" width="1440" height="330" rx="22" class="panel" />
  <text x="120" y="225" class="h2">1. 数据归属：云端是 source of truth</text>

  <rect x="122" y="260" width="410" height="185" rx="16" class="subpanel" />
  <text x="160" y="306" class="h3">Cloud Project</text>
  <rect x="160" y="326" width="218" height="38" rx="19" class="pill" />
  <text x="182" y="351" class="pillText">Cloud source of truth</text>
  <text x="160" y="395" class="small">Files 137 · Last change 4d ago</text>
  <text x="160" y="425" class="small">Access 12 · Remote cli_...qn9I</text>

  <path class="lineStrong" marker-end="url(#arrow-green)" d="M535 352 C630 352 654 352 744 352" />
  <text x="586" y="328" class="pillText">读取 / 写入 / 同步</text>

  <rect x="760" y="260" width="330" height="185" rx="16" class="subpanel" />
  <text x="800" y="306" class="h3">Desktop Editor</text>
  <text x="800" y="346" class="small">编辑体验、本地快捷操作</text>
  <text x="800" y="376" class="small">可以离线或暂存本地改动</text>
  <text x="800" y="416" class="mono">working copy</text>

  <path class="dash" marker-end="url(#arrow-muted)" d="M1095 352 C1190 352 1210 352 1290 352" />
  <rect x="1302" y="260" width="160" height="185" rx="16" class="subpanel" />
  <text x="1333" y="313" class="h3">Local</text>
  <text x="1333" y="350" class="small">path</text>
  <text x="1333" y="380" class="small">cache</text>
  <text x="1333" y="410" class="small">changes</text>

  <rect x="80" y="535" width="1440" height="365" rx="22" class="panel" />
  <text x="120" y="590" class="h2">2. Home 页面怎么表达</text>
  <text x="120" y="625" class="muted">首屏只放云端项目身份和云端基本信息；本地 path、working copy、未提交改动放到 Git Sync / Settings。</text>

  <rect x="122" y="665" width="420" height="185" rx="18" class="subpanel" />
  <path class="file" d="M176 710 h40 l24 24 v78 h-64 z" />
  <path class="folder" d="M273 726 h48 l13 14 h88 v58 h-149 z" />
  <path class="folder" d="M273 796 h48 l13 14 h88 v58 h-149 z" transform="translate(0 -38)" opacity="0.75" />
  <text x="168" y="835" class="tiny">居中的文件夹预览：视觉重心是 Cloud Project</text>

  <rect x="585" y="665" width="400" height="185" rx="18" class="subpanel" />
  <text x="625" y="710" class="h3">Untitled Project 2</text>
  <rect x="625" y="728" width="218" height="38" rx="19" class="pill" />
  <text x="647" y="753" class="pillText">Cloud source of truth</text>
  <text x="625" y="806" class="small">Refresh · Open Web</text>
  <text x="625" y="836" class="tiny">标题区负责告诉用户“这是云端项目”</text>

  <rect x="1030" y="665" width="405" height="185" rx="18" class="subpanel" />
  <rect x="1065" y="700" width="155" height="58" rx="10" fill="#fffaf1" stroke="#ded5c6" stroke-width="2" />
  <text x="1085" y="725" class="tiny">Files</text>
  <text x="1085" y="750" class="label">137</text>
  <rect x="1245" y="700" width="155" height="58" rx="10" fill="#fffaf1" stroke="#ded5c6" stroke-width="2" />
  <text x="1265" y="725" class="tiny">Last change</text>
  <text x="1265" y="750" class="label">4d ago</text>
  <rect x="1065" y="780" width="155" height="58" rx="10" fill="#fffaf1" stroke="#ded5c6" stroke-width="2" />
  <text x="1085" y="805" class="tiny">Access</text>
  <text x="1085" y="830" class="label">12</text>
  <rect x="1245" y="780" width="155" height="58" rx="10" fill="#fffaf1" stroke="#ded5c6" stroke-width="2" />
  <text x="1265" y="805" class="tiny">Remote</text>
  <text x="1265" y="830" class="mono">cli_...qn9I</text>

  <text x="120" y="945" class="label">一句话规则：</text>
  <text x="270" y="945" class="muted">Cloud 身份放 Home；Local 属性放 Git Sync / Settings；异常状态才提醒 local cache、offline、unsynced。</text>
</svg>
