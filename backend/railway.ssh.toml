# Separate optional raw-TCP service. Root directory remains backend/.
# Configure the TCP proxy to WORKSPACE_SSH_LISTEN_PORT; this is not an HTTP API.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.platform.access.adapters.ssh.gateway"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
