# Separate optional raw-TCP service. Root directory remains backend/.
# Configure the TCP proxy to WORKSPACE_SSH_LISTEN_PORT; this is not an HTTP API.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh scripts/start-service.sh"  # with SERVICE_ROLE=ssh_gateway
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
