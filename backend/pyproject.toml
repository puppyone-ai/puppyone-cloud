[project]
name = "contextbase"
version = "0.0.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "boto3>=1.41.5",
    "cachetools>=5.0.0",
    "cashews>=7.4.4",
    "cryptography>=46.0.3",
    "dulwich==1.2.1",
    "fastapi>=0.121.1",
    "fastmcp>=2.13.0.2",
    "firecrawl-py>=4.0.0",
    "httpx[socks]>=0.28.1",
    "jmespath>=1.0.1",
    "jsonpointer>=3.0.0",
    "jsonschema>=4.21.0",
    "litellm>=1.80.7",
    "lxml>=5.0.0",
    "moto[s3]>=5.0.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.10.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "redis[hiredis]>=5.3.1",
    "loguru>=0.7.2",
    "supabase>=2.25.0",
    "uvicorn>=0.38.0",
    "arq>=0.26.3",
    "aiohttp>=3.13.2",
    "aiohappyeyeballs>=2.6.1",
    "anthropic>=0.76.0",
    "e2b-code-interpreter>=2.4.1",
    "rich>=14.2.0",
    "apscheduler>=3.10.4",
    "watchdog>=6.0.0",
    "pymupdf>=1.25.0",
    "zipstream-ng>=1.9.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
    "e2b==2.53.1",
    "asyncssh>=2.21,<3",
    "websockets>=15,<16",
]

[project.scripts]
puppyone-ssh = "src.platform.access.adapters.ssh.gateway:main"
puppyone-db = "src.infra.data_migrations.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "mcp_service*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ASYNC: blocking calls inside coroutines (docs/architecture/18-concurrency-boundary.md).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "ASYNC"]
ignore = [
    "E501",     # line too long — handled by formatter
    "B008",     # Depends() in defaults — standard FastAPI pattern
    "BLE001",   # blind exception — addressed per-file, not globally
    "B904",     # raise from — low priority for HTTP routers
    "RUF001",   # ambiguous unicode chars (emoji in log messages)
    "RUF002",   # ambiguous unicode in docstrings (multiplication sign etc.)
    "RUF003",   # ambiguous unicode in comments (Chinese punctuation)
    "ASYNC109", # timeout parameters on async provider APIs are an interface choice
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "BLE001", "ASYNC"]  # tests block on purpose (stall probes)
"src/platform/upload/worker.py" = ["E402"]
# Pending: local file I/O still runs inside these coroutines (move it behind
# run_blocking). New modules get ASYNC230/ASYNC240 without exception.
"src/infra/file_processing/mineru/client.py" = ["ASYNC230", "ASYNC240"]
"src/platform/access/adapters/ssh/gateway.py" = ["ASYNC240"]
"src/platform/sandbox/providers/fly/transport.py" = ["ASYNC240"]
"src/ingest/router.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dependencies only point downward"
type = "layers"
layers = [
    "src.main",
    "src.composition",
    "src.internal : src.platform : src.content : src.tool : src.context_publish : src.file_operations : src.ingest",
    "src.version_engine",
    "src.infra : src.provider",
    "src.exception_handler : src.exceptions : src.config : src.utils : src.schemas : src.common_schemas",
    "src.shared_types",
]

[[tool.importlinter.contracts]]
name = "Core and base layers do not know the web framework"
type = "forbidden"
source_modules = ["src.version_engine", "src.infra", "src.provider", "src.shared_types"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Business modules point downward"
type = "layers"
layers = [
    "src.platform.dashboard : src.platform.onboarding",
    "src.platform.agent",
    "src.platform.access : src.internal",
    "src.ingest : src.platform.upload : src.platform.imports : src.platform.synchronize : src.platform.workspace : src.platform.hosts : src.platform.sandbox : src.platform.landing",
    "src.content : src.tool : src.context_publish : src.platform.provider_accounts : src.platform.managed_ai : src.platform.office : src.platform.template_registry",
    "src.platform.repository_target : src.platform.project : src.platform.repository_context : src.file_operations",
    "src.platform.billing : src.platform.analytics : src.platform.activity",
    "src.platform.auth : src.platform.organization : src.platform.profile : src.platform.entitlements : src.platform.authorization",
    "src.platform.idempotency : src.platform.query_contract",
]
# Existing violations. Remove an entry when its import is fixed; never add one.
# tests/architecture/test_import_layers.py pins the count.
ignore_imports = [
    "src.platform.auth.initialization -> src.platform.billing.provisioning",
    "src.platform.authorization.dependencies -> src.platform.project.dependencies",
    "src.platform.authorization.dependencies -> src.platform.project.models",
    "src.platform.authorization.dependencies -> src.platform.project.repository",
    "src.platform.billing.runtime -> src.platform.project.repository",
    "src.platform.landing.service -> src.platform.access.adapters.mcp_endpoint.schemas",
    "src.platform.landing.service -> src.platform.access.adapters.mcp_endpoint.service",
    "src.platform.landing.service -> src.platform.access.credential_repository",
    "src.platform.organization.router -> src.platform.billing.provisioning",
    "src.platform.organization.service -> src.platform.billing.provisioning",
    "src.platform.organization.service -> src.platform.billing.seats",
    "src.platform.profile.dependencies -> src.platform.project.dependencies",
    "src.platform.profile.service -> src.platform.project.service",
    "src.platform.project.deletion_cleanup -> src.platform.sandbox",
    "src.platform.project.deletion_cleanup -> src.platform.upload.config",
    "src.platform.project.deletion_cleanup -> src.platform.upload.dependencies",
    "src.platform.project.deletion_cleanup -> src.platform.upload.tasks.repository",
    "src.platform.project.deletion_cleanup -> src.platform.workspace.project_cleanup",
    "src.platform.project.router -> src.platform.template_registry.dependencies",
    "src.platform.project.router -> src.platform.template_registry.exceptions",
    "src.platform.project.router -> src.platform.template_registry.http_errors",
    "src.platform.project.router -> src.platform.template_registry.schemas",
    "src.platform.project.router -> src.platform.template_registry.service",
    "src.platform.repository_context.repository -> src.platform.access.credential_repository",
    "src.platform.repository_context.router -> src.platform.access.adapters.git.locator",
    "src.platform.repository_context.service -> src.platform.access.credential_repository",
    "src.platform.repository_target.scope_router -> src.platform.access.model_repository",
]

[[tool.importlinter.contracts]]
name = "Project knows none of its entry points"
type = "forbidden"
source_modules = ["src.platform.project"]
forbidden_modules = ["src.platform.access", "src.platform.agent"]

[[tool.importlinter.contracts]]
name = "Auth knows no Project"
type = "forbidden"
source_modules = ["src.platform.auth"]
forbidden_modules = ["src.platform.project"]

[[tool.importlinter.contracts]]
name = "Sandbox knows none of its callers"
type = "forbidden"
source_modules = ["src.platform.sandbox"]
forbidden_modules = ["src.platform.workspace", "src.platform.access", "src.platform.agent"]

[[tool.importlinter.contracts]]
name = "Workspace knows none of its callers"
type = "forbidden"
source_modules = ["src.platform.workspace"]
forbidden_modules = ["src.platform.access", "src.platform.agent"]
allow_indirect_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
markers = [
    "e2e: end-to-end tests that may call real external services",
    "integration: integration tests that call live third-party APIs or require explicit operator opt-in",
    "network: tests that require public internet access and should run only in non-blocking smoke jobs",
    # Test kinds, set from the directory a test lives in (tests/conftest.py); see tests/README.md.
    "unit: fakes only, no service of any kind",
    "contract: a published contract (protocol, OpenAPI, database) checked against the code",
    "native: real services started on this machine (PostgreSQL 17, PostgREST, S3, Redis)",
    "live: real third-party services",
    "acceptance: a deployed environment",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
]
